<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Feedback</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        form { margin-bottom: 30px; }
        label { display: block; margin-top: 10px; }
        input, textarea { width: 300px; padding: 6px; margin-top: 4px; }
        button { margin-top: 10px; padding: 6px 12px; }
        table { border-collapse: collapse; width: 100%; max-width: 700px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background: #f0f0f0; }
        .invalid { color: #b00020; }
        .valid { color: #006400; }
    </style>
</head>
<body>
    <h1>Student Feedback Form</h1>

    <form method="POST">
        <label>Name:
            <input type="text" name="name" required>
        </label>

        <label>Course:
            <input type="text" name="course" required>
        </label>

        <label>Email (must end with @niet.co.in):
            <input type="email" name="email" required>
        </label>

        <label>Feedback:
            <textarea name="feedback" rows="4" required></textarea>
        </label>

        <button type="submit">Submit Feedback</button>
    </form>

    <h2>Submitted Feedback</h2>
    {% if feedbacks %}
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Course</th>
                <th>Email</th>
                <th>Feedback</th>
                <th>Email Valid</th>
            </tr>
        </thead>
        <tbody>
            {% for f in feedbacks %}
            <tr>
                <td>{{ f.name }}</td>
                <td>{{ f.course }}</td>
                <td>{{ f.email }}</td>
                <td>{{ f.feedback }}</td>
                <td class="{{ 'valid' if f.email_valid else 'invalid' }}">
                    {{ 'Yes' if f.email_valid else 'No' }}
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    {% else %}
    <p>No feedback submitted yet.</p>
    {% endif %}
</body>
</html>
